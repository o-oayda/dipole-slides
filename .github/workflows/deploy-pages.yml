name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          rm -rf _site
          mkdir -p _site

          cp index.html _site/ 2>/dev/null || true
          cp CNAME _site/ 2>/dev/null || true
          cp -r assets _site/ 2>/dev/null || true

          find slides -maxdepth 1 -type f -name "*.pdf" -exec cp {} _site/ \;

          echo "Contents of _site:"
          find _site -maxdepth 2 -type f -print

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
